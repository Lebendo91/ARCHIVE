[package]
name = "archive"
version = "0.1.0"
description = "ARCHIVE — Your Second Brain. Local-first personal knowledge management."
authors = ["ARCHIVE"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "archive_lib"
path = "src/lib.rs"

[[bin]]
name = "archive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

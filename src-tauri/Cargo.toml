[package]
name = "archive"
version = "0.1.0"
description = "ARCHIVE — Your Second Brain. Local-first personal knowledge management."
authors = ["ARCHIVE"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "archive_lib"
path = "src/lib.rs"

[[bin]]
name = "archive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1.29", features = ["v7"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
log = "0.4"
fs4 = "1.1"
# `deny_unknown_fields` does not change the generated types: ts-rs would only warn that it ignores it.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tauri-plugin-dialog = "2.8"
quick-xml = "0.42"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27"
